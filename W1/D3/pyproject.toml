[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-advent-w1-d3"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["httpx>=0.28,<0.29", "python-dotenv>=1,<2", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-bdd>=8,<9"]

[project.scripts]
day3 = "day3.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
