[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-advent-w3-d2"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["httpx>=0.28,<0.29", "python-dotenv>=1,<2", "jsonschema>=4.23,<5", "tokenizers>=0.21,<0.23", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-bdd>=8,<9"]
[project.scripts]
agent12 = "agent12.web:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
agent12 = ["index.html", "layers.html"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
